# TalkTrack CRM — nginx site for the VPS.
# Install: /etc/nginx/sites-available/talktrack → symlink into sites-enabled,
# then `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    server_name talktrackcrm.brillbrainsconsultants.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name talktrackcrm.brillbrainsconsultants.com;

    ssl_certificate     /etc/letsencrypt/live/talktrackcrm.brillbrainsconsultants.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talktrackcrm.brillbrainsconsultants.com/privkey.pem;

    # Showroom photos are posted as base64 JSON, so an 8MB image is ~11MB of
    # request body. Without this, nginx rejects uploads with 413.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The Meta OAuth redirect_uri is derived from these. Wrong values bring
        # back the redirect_uri mismatch that broke WhatsApp onboarding before.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }
}
